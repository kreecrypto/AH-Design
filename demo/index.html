<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>AH Design v2.6 · Interactive Mock Data Demo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell" id="appShell">
    <div class="drawer-scrim" id="scrim" hidden></div>
    <aside class="sidebar" id="sidebar" aria-label="เมนูตัวอย่าง">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">AH</div>
        <div class="brand-copy"><strong>AH Workspace</strong><small>Design System v2.6</small></div>
        <button class="drawer-close icon-button" id="closeDrawer" aria-label="ปิดเมนู"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <nav class="sidebar-nav" id="sidebarNav" aria-label="ตัวอย่างการนำทาง">
        <div class="nav-section-label">WORKSPACE</div>
        <button class="nav-link active" data-view="overview" aria-current="page" title="ภาพรวม">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg><span class="nav-label">ภาพรวม</span>
        </button>
        <button class="nav-link" data-view="listing" title="รายการทั้งหมด">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01" stroke-width="3" stroke-linecap="round"/></svg><span class="nav-label">รายการ</span><span class="nav-count" id="navCount">24</span>
        </button>
        <button class="nav-link" data-view="analytics" title="รายงาน">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="m7 16 4-5 4 2 5-7"/></svg><span class="nav-label">รายงาน</span>
        </button>
        <div class="nav-section-label group">ACTIONS</div>
        <button class="nav-link" data-view="create" title="สร้างรายการใหม่">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/></svg><span class="nav-label">สร้างรายการใหม่</span>
        </button>
      </nav>
      <div class="sidebar-bottom">
        <div class="demo-indicator"><span class="indicator-dot"></span><span class="indicator-text">MOCK DATA MODE</span></div>
        <p>ข้อมูลสาธิต • ไม่มีการเชื่อมต่อ API</p>
      </div>
    </aside>
    <div class="main-pane" id="mainPane">
      <header class="topbar">
        <div class="topbar-heading">
          <button class="icon-button menu-trigger" id="openDrawer" aria-label="เปิดเมนู"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
          <h1 id="pageTitle" tabindex="-1">ภาพรวม</h1>
        </div>
        <div class="topbar-controls">
          <label class="top-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><span class="sr-only">ค้นหารายการ</span><input type="search" id="globalSearch" placeholder="ค้นหารายการตัวอย่าง..."></label>
          <div class="top-actions">
            <button class="icon-button notification-button" id="helpButton" aria-label="ข้อมูลโหมดสาธิต" title="ข้อมูลโหมดสาธิต"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></svg></button>
            <div class="avatar" title="Demo User">DU</div>
          </div>
        </div>
      </header>
      <main id="mainContent" class="main-content" tabindex="-1"></main>
    </div>
  </div>
  <div id="detailScrim" class="detail-scrim" hidden></div>
  <aside id="detailPanel" class="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detailTitle" tabindex="-1" hidden inert></aside>
  <dialog id="resetConfirm" class="confirm-dialog" aria-labelledby="resetTitle" aria-describedby="resetDescription">
    <form method="dialog">
      <h2 id="resetTitle">รีเซ็ตข้อมูลตัวอย่าง?</h2>
      <p id="resetDescription">รายการที่สร้างใหม่และการแก้ไขสถานะทั้งหมดจะถูกลบ และคืนค่าเป็นข้อมูลจำลองเริ่มต้น 24 รายการ การดำเนินการนี้ย้อนกลับไม่ได้</p>
      <div class="confirm-actions"><button type="submit" class="btn btn-outline" value="cancel">ยกเลิก</button><button type="submit" class="btn btn-primary" id="confirmReset" value="confirm">รีเซ็ตทั้งหมด</button></div>
    </form>
  </dialog>
  <div class="toast-container" id="toastContainer" role="status" aria-live="polite"></div>
  <script src="mock-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
